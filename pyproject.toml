[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnidirectional-dwvp"
version = "0.1.0"
description = "Reproducible omnidirectional Vector Pursuit and Dynamic Window Vector Pursuit studies"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "matplotlib>=3.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.10"]

[project.scripts]
dwvp-study = "omnidirectional_dwvp.studies:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:launch_testing", "-p", "no:launch_ros"]
